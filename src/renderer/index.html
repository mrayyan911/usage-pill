<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
    <title>Usage Pill</title>
    <link rel="stylesheet" href="pill.css" />
  </head>
  <body>
    <div class="pill" id="pill">
      <div class="pill-inner">
        <div class="pill-row">
          <div class="icon-wrap">
            <span class="icon" id="icon">—</span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" id="barFill"></div>
            <div class="bar-shimmer" id="barShimmer"></div>
          </div>
          <div class="percent" id="percent">—</div>
        </div>
        <div class="detail-row">
          <div class="detail" id="detail"></div>
        </div>
      </div>
    </div>
    <script src="icons.js"></script>
    <script src="pill.js"></script>
  </body>
</html>
