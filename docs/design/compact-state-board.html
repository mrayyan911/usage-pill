<!doctype html>

<title>Usage Pill — native-scale state board</title>
<style>
  body { margin: 40px; background: #181818; color: #d0d0d0; font: 14px system-ui, sans-serif; }

<h1>Collapsed = presence. Expanded = information.</h1>

  <figure><figcaption>One agent · expanded · 248 × 50px</figcaption><img src="../../design-review/screenshots/compact-expanded-one.png" alt="Claude mark, thin usage bar and 60 percent"></figure>
  <figure><figcaption>Two agents · expanded · 248 × 74px</figcaption><img src="../../design-review/screenshots/compact-expanded-two.png" alt="Two compact rows showing Claude at 60 percent and Codex at 90 percent"></figure>
